name: CineSched
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "4"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CineSched:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.zip"
          - "*.png"
          - "LICENSE"
          - "project.yml"
          - "Tests"
          - "Tests/**"
          - "CineSched.xcodeproj"
          - "CineSched.xcodeproj/**"
          - ".git"
          - ".git/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: PyroStudios.CineSched
        PRODUCT_NAME: CineSched
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CineSched
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: CineSched.entitlements
    
  CineSchedTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests
    dependencies:
      - target: CineSched
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: PyroStudios.CineSchedTests

schemes:
  CineSched:
    build:
      targets:
        CineSched: all
        CineSchedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CineSchedTests
